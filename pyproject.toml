[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm2048"
version = "0.1.0"
description = "Reproducible experiment runner for 2048 Student Policy research"
requires-python = ">=3.11"
dependencies = [
  "tensorboard>=2.17",
  "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
]
grpo = [
  "bitsandbytes==0.50.0",
  "datasets==4.3.0",
  "peft==0.20.0",
  "socksio==1.0.0",
  "tensorboard==2.21.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==5.5.0",
  "trl==0.24.0",
  "unsloth==2026.7.4",
  "unsloth-zoo==2026.7.7",
  "wandb==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["tensorboard.*"]
ignore_missing_imports = true
